[project]
name = "trust-gate"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.165.0", "uvicorn[standard]==0.38.0", "pydantic-settings==2.12.0",
  "sqlalchemy[asyncio]==2.0.44", "asyncpg==0.30.0", "alembic==1.16.5",
  "cryptography==46.0.3", "httpx==0.28.1", "google-auth==2.41.1",
  "google-auth-oauthlib==1.2.3", "google-api-python-client==2.187.0",
  "google-genai==3.6.1", "mcp>=2.0,<3", "presidio-analyzer==2.2.360",
  "presidio-anonymizer==2.2.360", "pypdf==6.1.3", "python-docx==1.2.0",
  "openpyxl==3.1.5", "python-multipart==0.0.20"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
